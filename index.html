<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b0a09"/>
<title>Leviathan Ink</title>
<style>
:root{--ink:#0b0a09;--bone:#efe8dc;--blood:#a33b35;--gold:#c4a056;--mute:#b9b0a4;--line:#2c241f;--safe:env(safe-area-inset-bottom,16px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;background:var(--ink);color:var(--bone);font-family:"Didot","Times New Roman",serif}
body{background:radial-gradient(1200px 700px at 50% -10%,#241818 0%,#0b0a09 55%)}
.app{max-width:430px;margin:0 auto;min-height:100dvh;padding:18px 18px calc(92px + var(--safe))}
.logo{width:min(260px,70%);display:block;margin:8px auto 14px;border-radius:10px;background:var(--bone)}
.eyebrow{text-align:center;letter-spacing:.22em;text-transform:uppercase;font-size:10px;color:var(--gold);font-family:-apple-system,sans-serif;font-weight:700}
h1{text-align:center;font-weight:500;font-size:28px;margin:6px 0 14px}
h2{font-size:18px;font-weight:500;margin-bottom:8px}
p,li,label{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:var(--mute);font-size:14px;line-height:1.45}
.card{background:rgba(18,14,12,.82);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.goldline{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px 0 14px}
button{font-family:-apple-system,sans-serif}
.primary,.secondary,.ghost,.slot{appearance:none;width:100%;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
.primary{background:var(--blood);color:var(--bone);border:0}
.secondary{background:#161210;color:var(--bone);border:1px solid var(--line)}
.ghost{background:transparent;color:var(--bone);border:1px solid var(--line);width:auto;padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px}
.artist{display:flex;gap:12px;align-items:center}
.avatar{width:50px;height:50px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-family:-apple-system,sans-serif;font-weight:800}
input,select,textarea{width:100%;background:#100e0c;color:var(--bone);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin:6px 0 12px;font-family:-apple-system,sans-serif}
.field{display:block;color:var(--bone);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-family:-apple-system,sans-serif;font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px calc(8px + var(--safe));background:rgba(11,10,9,.94);border-top:1px solid var(--line)}
.tabbar button{background:transparent;border:0;color:var(--mute);font-size:11px;font-weight:700;padding:8px 4px}
.tabbar button.active{color:var(--gold)}
.note{font-size:13px}.ok{color:#8fbf7a}.status{color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-family:-apple-system,sans-serif;font-weight:800}
.bubble{padding:10px 12px;border-radius:14px;margin-bottom:8px;max-width:86%;font-family:-apple-system,sans-serif;font-size:14px}
.bubble.me{background:var(--blood);color:var(--bone);margin-left:auto}
.bubble.them{background:#161210;border:1px solid var(--line)}
.who{text-align:center;font-size:12px;color:var(--gold);margin-bottom:10px;font-family:-apple-system,sans-serif}
.check{display:flex;gap:10px;align-items:flex-start;font-family:-apple-system,sans-serif;color:var(--bone);font-size:13px;margin:8px 0 14px}
.check input{width:auto;margin:3px 0 0}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.slot{background:#100e0c;border:1px solid var(--line);color:var(--bone)}
.slot.on{border-color:var(--gold);color:var(--gold)}
.vidframe{width:100%;height:52vh;border:0;border-radius:16px;background:#000;margin-bottom:8px}
</style>
</head>

function bannedArtist(a){
  const n=((a&&a.name)||"")+" "+((a&&a.user)||"");
  return /elisa|scoob|hit.?em/i.test(n);
}
function syncLiveRoster(){
  const have=store.cfg.artists||[];
  const live=DEFAULTS.artists.map(w=>{
    const old=have.find(h=>!bannedArtist(h)&&(h.name||"").toLowerCase()===w.name.toLowerCase());
    return old?Object.assign({},w,{work:old.work||[],pin:old.pin||w.pin,user:old.user||w.user,role:old.role||w.role}):JSON.parse(JSON.stringify(w));
  });
  const extra=have.filter(h=>!bannedArtist(h)&&!DEFAULTS.artists.some(w=>(w.name||"").toLowerCase()===(h.name||"").toLowerCase()));
  // live site roster only — drop extras and banned names
  store.cfg.artists=live;
  store.cfg.rosterVersion=DEFAULTS.rosterVersion;
  store.cfg.artists.forEach(a=>{
    if(!Array.isArray(a.work)) a.work=[];
    if(!a.user) a.user=(a.name||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    if(!a.pin) a.pin=String(store.cfg.pins.artist||"1111");
  });
  try{localStorage.setItem("levCfg",JSON.stringify(store.cfg))}catch(e){}
}

function applyTheme(){

function apiBase(){
  const u=(store.cfg&&store.cfg.apiUrl)||"";
  if(u) return String(u).replace(/\/$/,"");
  if(typeof location!=="undefined" && /^https?:$/.test(location.protocol) && location.hostname && location.hostname!==""){
    return location.origin;
  }
  return "";
}
function shopHeaders(){
  const h={"Content-Type":"application/json"};
  const k=(store.cfg&&store.cfg.shopKey)||"";
  if(k) h["X-Shop-Key"]=k;
  return h;
}
function save(){
  localStorage.setItem("levCfg",JSON.stringify(store.cfg));
  localStorage.setItem("levSession",JSON.stringify(store.session));
  localStorage.setItem("levBookings",JSON.stringify(store.bookings));
  localStorage.setItem("levMsgs",JSON.stringify(store.messages));
  localStorage.setItem("levPayroll",JSON.stringify(store.payroll||[]));
  pushLive();
}
let _pushT=null;
function pushLive(){
  const base=apiBase();
  if(!base) return;
  clearTimeout(_pushT);
  _pushT=setTimeout(async()=>{
    try{
      await fetch(base+"/api/state",{method:"PUT",headers:shopHeaders(),body:JSON.stringify({
        cfg:store.cfg,
        bookings:store.bookings,
        messages:store.messages,
        payroll:store.payroll||[],
        accounts:accounts()
      })});
    }catch(e){}
  },300);
}
async function pullLive(quiet){
  const base=apiBase();
  if(!base) return false;
  try{
    const r=await fetch(base+"/api/health").catch(()=>null);
    if(!r||!r.ok){
      const r2=await fetch(base+"/api/state",{headers:shopHeaders()});
      if(!r2.ok) return false;
      const d=await r2.json();
      applyRemote(d);return true;
    }
    const s=await fetch(base+"/api/state",{headers:shopHeaders()});
    if(!s.ok) return false;
    applyRemote(await s.json());
    return true;
  }catch(e){return false}
}
function applyRemote(d){

    store.cfg=Object.assign({},DEFAULTS,d.cfg);

    if(!store.cfg.artists) store.cfg.artists=DEFAULTS.artists.slice();
  }
  if(Array.isArray(d.bookings)) store.bookings=d.bookings;
  if(Array.isArray(d.messages)) store.messages=d.messages;
  if(Array.isArray(d.payroll)) store.payroll=d.payroll;
  if(Array.isArray(d.accounts)) localStorage.setItem("levAccounts",JSON.stringify(d.accounts));
  try{
    localStorage.setItem("levCfg",JSON.stringify(store.cfg));
    localStorage.setItem("levBookings",JSON.stringify(store.bookings));
    localStorage.setItem("levMsgs",JSON.stringify(store.messages));
    localStorage.setItem("levPayroll",JSON.stringify(store.payroll||[]));
  }catch(e){}
}

function render(loginKind){applyTheme();
  const screen=document.getElementById("screen");
  const title=document.getElementById("pageTitle");
  const who=document.getElementById("who");
  const eye=document.getElementById("eyebrow");
  if(!store.session){
    screen.innerHTML=loginView(loginKind);
    screen.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>render(b.dataset.kind||undefined));
    const gc=document.getElementById("goClient");
    if(gc) gc.onclick=()=>{
      const name=document.getElementById("name").value.trim();
      const phone=document.getElementById("phone").value.trim();
      if(!name||!phone) return alert("Name and phone required.");
      const acc=accounts().find(a=>a.phone===phone);
      store.session={role:"client",name:(acc&&acc.name)||name,phone,email:acc&&acc.email};store.tab="home";save();render();
    };
    const gj=document.getElementById("goJoin");
    if(gj) gj.onclick=()=>{
      const name=val("name").trim(), phone=val("phone").trim(), email=val("email").trim(), pin=val("pin");
      if(!name||!phone) return alert("Name and phone required.");
      if(pin.length<4) return alert("Choose a 4+ digit PIN so you can log back in.");
      saveAccount({name,phone,email,pin,created:Date.now()});
      store.session={role:"client",name,phone,email};store.tab="home";
      store.flow={type:"walkin",step:1};
      save();render();
    };
    const ga=document.getElementById("goArtist");
    if(ga) ga.onclick=()=>{
      const user=(document.getElementById("user").value||"").trim().toLowerCase();
      const pin=document.getElementById("pin").value;
      if(!user||!pin) return alert("Username and PIN required.");
      const a=artists().find(x=>(x.user||"").toLowerCase()===user);
      if(!a||String(a.pin)!==String(pin)) return alert("Wrong artist login.");
      store.session={role:"artist",artistId:a.id,name:a.name};store.tab="queue";save();render();
    };
    const gd=document.getElementById("goDesk");
    if(gd) gd.onclick=()=>{
      if(document.getElementById("pin").value!==String(store.cfg.pins.desk)) return alert("Wrong shop PIN.");
      store.session={role:"desk",name:document.getElementById("name").value.trim()||"Desk"};store.tab="board";save();render();
    };
    const gad=document.getElementById("goAdmin");
    if(gad) gad.onclick=()=>{
      if(document.getElementById("pin").value!==String(store.cfg.pins.admin)) return alert("Wrong admin PIN.");
      store.session={role:"admin",name:document.getElementById("name").value.trim()||"Admin"};store.tab="studio";save();render();
    };
    return;
  }
  const s=store.session;
  const bar=document.getElementById("tabbar");
  bar.style.gridTemplateColumns=`repeat(${TABS[s.role].length},1fr)`;
  bar.innerHTML=TABS[s.role].map(([id,l])=>`<button data-tab="${id}" class="${store.tab===id?"active":""}">${l}</button>`).join("");
  eye.textContent=s.role==="client"?"Client book":s.role==="artist"?"Private artist book":s.role==="admin"?"Admin":"Front desk";
  who.textContent=s.role==="artist"?s.name+" · signed in":s.role==="desk"?"Reception · "+s.name:s.role==="admin"?"Admin · "+s.name:s.name+" · "+s.phone;
  if(store.video){
    title.textContent="Consult";
    screen.innerHTML=videoView();
    document.getElementById("leaveVid").onclick=()=>{store.video=null;render()};
    const fv=document.getElementById("fullVid");
    if(fv) fv.onclick=()=>window.open("https://meet.jit.si/"+encodeURIComponent(store.video.room));
    return;
  }
  if(store.chatWith){title.textContent="Atelier";screen.innerHTML=chatView();bindChat();return}
  if(s.role==="client") return renderClient();
  if(s.role==="artist") return renderArtist();
  if(s.role==="admin") return renderAdmin();
  return renderDesk();
}

function validateConsent(c){
  if(!c.name||!c.dob||!c.age||!c.addr||!c.city||!c.phone||!c.emName||!c.emPhone) return "Complete client and emergency contact fields.";
  if(!c.proc) return "Choose tattoo or piercing.";
  if(!c.place||!c.idea) return "Add body location and description.";
  const qs=["hPreg","hBleed","hDiab","hEpil","hThin","hHeart","hAll","hSkin","hDrug","hEat"];
  if(qs.some(k=>!c[k])) return "Answer every health question.";
  if(c.hDrug==="yes") return "We cannot tattoo or pierce anyone under the influence.";
  if(c.proc==="Tattoo" && Number(c.age)<18) return "Tattoos are 18+ with ID.";
  if(!document.getElementById("cAgree1").checked||!document.getElementById("cAgree2").checked||!document.getElementById("cAgree3").checked||!document.getElementById("cAgree4").checked||!document.getElementById("cAfter").checked) return "Check every agreement box.";
  if(c.sign.trim().toLowerCase()!==c.name.trim().toLowerCase()) return "Signature must match full legal name.";
  if(!(c.docs&&c.docs.docId)) return "Upload a photo of your government ID.";
  return "";
}

function validateMinorConsent(c){
  if(!c.name||!c.dob||!c.age||!c.addr||!c.city) return "Complete the minor’s information.";
  if(Number(c.age)>=18) return "Use the adult consent form for clients 18+.";
  if(!c.gName||!c.gRel||!c.gPhone) return "Complete parent / legal guardian information.";
  if(!document.getElementById("cBirth").checked||!document.getElementById("cGuardId").checked||!document.getElementById("cAuth").checked) return "Confirm birth certificate, guardian ID, and legal authority.";
  if(c.gIdYes!=="yes") return "Guardian photo ID must be presented at the chair.";
  if(!c.place||!c.idea) return "Add piercing location and type.";
  const qs=["hPreg","hBleed","hDiab","hEpil","hThin","hHeart","hAll","hSkin","hIll","hEat"];
  if(qs.some(k=>!c[k])) return "Answer every health question.";
  if(!document.getElementById("cAgree1").checked||!document.getElementById("cAgree2").checked||!document.getElementById("cAgree3").checked||!document.getElementById("cAfter").checked) return "Check every consent box.";
  if(!c.gInit||!c.mInit) return "Parent and minor must initial aftercare.";
  if(c.sign.trim().toLowerCase()!==c.gName.trim().toLowerCase()) return "Guardian signature must match guardian legal name.";
  if(c.minorSign.trim().toLowerCase()!==c.name.trim().toLowerCase()) return "Minor signature must match the minor’s legal name.";
  if(!(c.docs&&c.docs.docBirth)) return "Upload a photo of the minor’s birth certificate.";

  return "";
}

function bindFlow(){
  const f=store.flow;
  const c=document.getElementById("cancelF");if(c)c.onclick=()=>{store.flow=null;render()};
  const b=document.getElementById("back");if(b)b.onclick=()=>{
    if(f.step==="form") f.step="gate";
    else if(f.step==="gate") f.step=f.bookingId?null:(f.type==="walkin"?1:2);
    else if(f.step==="pay") f.step="form";
    else f.step=typeof f.step==="number"?f.step-1:1;
    if(!f.step){store.flow=null}
    render();
  };
  const ad=document.getElementById("adultC");if(ad)ad.onclick=()=>{f.minor=false;f.step="form";render()};
  const mi=document.getElementById("minorC");if(mi)mi.onclick=()=>{f.minor=true;f.step="form";render()};
  document.querySelectorAll("[data-artist]").forEach(x=>x.onclick=()=>{f.artistId=x.dataset.artist;f.step=f.type==="walkin"?"gate":2;render()});
  document.querySelectorAll("[data-slot]").forEach(x=>x.onclick=()=>{document.querySelectorAll("[data-slot]").forEach(z=>z.classList.remove("on"));x.classList.add("on");f.slot=x.dataset.slot});
  const nf=document.getElementById("nextFlash");if(nf)nf.onclick=()=>{if(!f.slot)return alert("Pick a time");f.step="gate";render()};
  const pay=document.getElementById("pay");if(pay)pay.onclick=()=>finish(true);
  const pw=document.getElementById("payWix");
  if(pw) pw.onclick=()=>{
    const url=(store.cfg.payUrl||"https://www.leviathanink.biz/book-online");
    window.open(url,"_blank","noopener");
  };
  const sub=document.getElementById("submit");if(sub)sub.onclick=()=>{if(!document.getElementById("agree").checked)return alert("Accept house rules.");f.place=document.getElementById("place")?.value||"";f.idea=document.getElementById("idea")?.value||"";if(f.type==="consult") return finish(false);f.step="gate";render()};
  bindDocInputs(["docId","docExtra","docBirth","docGuardId","docCustody"]);
  const sw=document.getElementById("signWalk");
  if(sw) sw.onclick=()=>{
    const c=f.minor?readMinorConsent():readConsent();
    const err=f.minor?validateMinorConsent(c):validateConsent(c);
    if(err) return alert(err);
    f.consent=c;f.place=c.place||f.place;f.idea=c.idea||f.idea;
    store.session.name=c.name;store.session.phone=c.phone||c.gPhone||store.session.phone;
    if(f.bookingId){
      const b=store.bookings.find(x=>x.id===f.bookingId);
      if(b){b.consent=c;b.place=f.place;b.idea=f.idea;if(c.name)b.name=c.name}
      save();
      store.flow=null;store.tab="mine";store.viewPacket=f.bookingId;
      render();
      if((store.cfg.printer||{}).autoPrint!==false && b) printConsentSheet(b);
      return;
    }
    if(f.type==="flash"){f.step="pay";render();return}
    finish(false);
  };
}

const WEEKDAYS=[["sun","Sun"],["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["sat","Sat"]];
function defaultWeekHours(){
  const o={};
  WEEKDAYS.forEach(([k])=>o[k]={on:true,start:"11:00",end:"22:00"});
  return o;
}
function artistSched(a){
  if(!a.schedule) a.schedule={week:defaultWeekHours(),days:{}};
  if(!a.schedule.week) a.schedule.week=defaultWeekHours();
  if(!a.schedule.days) a.schedule.days={};
  WEEKDAYS.forEach(([k])=>{if(!a.schedule.week[k]) a.schedule.week[k]={on:true,start:"11:00",end:"22:00"}});
  return a.schedule;
}
function ymd(d){
  const x=d instanceof Date?d:new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}
function parseYmd(s){const [y,m,da]=(s||"").split("-").map(Number);return new Date(y,m-1,da);}
function addDays(s,n){const x=parseYmd(s);x.setDate(x.getDate()+n);return ymd(x)}
function weekdayKey(s){return WEEKDAYS[parseYmd(s).getDay()][0]}
function dayLabel(s){return parseYmd(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function hoursFor(a,s){
  const sch=artistSched(a);
  if(sch.days[s]) return sch.days[s];
  return sch.week[weekdayKey(s)]||{on:false,start:"11:00",end:"22:00"};
}
function applyArtistHours(a,start,mode){
  const sch=artistSched(a);
  let dates=[];
  if(mode==="month"){
    const d=parseYmd(start);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0);
    for(let x=new Date(d);x<=last;x.setDate(x.getDate()+1)) dates.push(ymd(x));
  }else if(mode==="nextmonth"){
    const d=parseYmd(start);
    const first=new Date(d.getFullYear(),d.getMonth()+1,1);
    const last=new Date(d.getFullYear(),d.getMonth()+2,0);
    for(let x=new Date(first);x<=last;x.setDate(x.getDate()+1)) dates.push(ymd(x));
  }else{
    const n=Number(mode)||7;
    for(let i=0;i<n;i++) dates.push(addDays(start,i));
  }
  dates.forEach(s=>{
    const w=sch.week[weekdayKey(s)];
    sch.days[s]={on:!!w.on,start:w.start||"11:00",end:w.end||"22:00"};
  });
  return dates.length;
}
function hoursView(id){

      </div>

  const upcoming=[];
  for(let i=0;i<21;i++) upcoming.push(addDays(today,i));
  const list=upcoming.map(s=>{
    const h=hoursFor(a,s);
    const locked=!!sch.days[s];
    return `<div class="card" style="padding:10px 12px">
      <p class="status">${dayLabel(s)}${locked?" · set":" · from weekly pattern"}</p>
      <p>${h.on?(h.start+" – "+h.end):"Off"}</p>
      <div class="row" style="margin-top:8px">

  }).join("");
  return `<div class="card"><p class="status">${a.name}</p><h2>My hours</h2>
    <p>Set a weekly pattern, then stamp it onto this week, the next few weeks, or a month. Edit any single day after that.</p></div>
    <div class="card"><h2>Weekly pattern</h2><p class="note">Shop default is 11:00 AM – 10:00 PM.</p></div>
    ${weekHtml}
    <button class="primary" id="saveWeek">Save weekly pattern</button>
    <div class="card" style="margin-top:12px"><h2>Apply to dates</h2>
      <label class="field">Start date</label><input type="date" id="schedStart" value="${today}"/>
      <label class="field">How far</label>
      <select id="schedSpan">
        <option value="7">This week (7 days)</option>
        <option value="14">2 weeks</option>
        <option value="28">4 weeks</option>
        <option value="56">8 weeks</option>
        <option value="month">Rest of this calendar month</option>
        <option value="nextmonth">Next calendar month</option>
      </select>
    </div>
    <button class="primary" id="applyHours">Apply pattern to those dates</button>
    <div style="height:8px"></div>
    <button class="secondary" id="clearHours">Clear saved days from start date forward</button>
    <div class="card" style="margin-top:12px"><h2>Next 3 weeks</h2></div>
    ${list}
    <button class="ghost" id="out">${L("signOut","Sign out")}</button>`;
}
function bindHours(id){
  const a=aBy(id);
  const sch=artistSched(a);
  document.getElementById("saveWeek").onclick=()=>{
    WEEKDAYS.forEach(([k])=>{
      const on=document.querySelector('[data-wd="'+k+'"]');
      const st=document.querySelector('[data-ws="'+k+'"]');
      const en=document.querySelector('[data-we="'+k+'"]');
      sch.week[k]={on:!!(on&&on.checked),start:(st&&st.value)||"11:00",end:(en&&en.value)||"22:00"};
    });
    save();alert("Weekly pattern saved.");render();
  };
  document.getElementById("applyHours").onclick=()=>{
    WEEKDAYS.forEach(([k])=>{
      const on=document.querySelector('[data-wd="'+k+'"]');
      const st=document.querySelector('[data-ws="'+k+'"]');
      const en=document.querySelector('[data-we="'+k+'"]');
      if(on) sch.week[k]={on:!!on.checked,start:(st&&st.value)||"11:00",end:(en&&en.value)||"22:00"};
    });
    const start=val("schedStart")||ymd(new Date());
    const n=applyArtistHours(a,start,val("schedSpan"));
    save();alert("Hours set on "+n+" days.");render();
  };
  document.getElementById("clearHours").onclick=()=>{
    const start=val("schedStart")||ymd(new Date());
    if(!confirm("Clear saved day hours from "+start+" forward? Weekly pattern stays."))return;
    Object.keys(sch.days).forEach(k=>{if(k>=start) delete sch.days[k]});
    save();render();
  };
  document.querySelectorAll("[data-off]").forEach(btn=>btn.onclick=()=>{
    const s=btn.dataset.off;
    const cur=hoursFor(a,s);
    sch.days[s]={on:!cur.on,start:cur.start||"11:00",end:cur.end||"22:00"};
    save();render();
  });
  document.querySelectorAll("[data-ed]").forEach(btn=>btn.onclick=()=>{
    const s=btn.dataset.ed;
    const cur=hoursFor(a,s);
    const start=prompt("Start time (HH:MM)",cur.start||"11:00");
    if(start===null) return;
    const end=prompt("End time (HH:MM)",cur.end||"22:00");
    if(end===null) return;
    sch.days[s]={on:true,start:start||"11:00",end:end||"22:00"};
    save();render();
  });
  document.getElementById("out").onclick=logout;
}

function bindDesk(){
  document.querySelectorAll("[data-d]").forEach(btn=>btn.onclick=()=>{
    const b=store.bookings.find(x=>x.id===btn.dataset.id);if(!b)return;
    if(btn.dataset.d==="seat")b.status="Seated";
    if(btn.dataset.d==="noshow")b.status="No-show";
    if(btn.dataset.d==="dep"){
      b.deposit=store.cfg.policy.deposit;
      b.depositConfirmed=true;
      b.depositConfirmedAt=Date.now();
      b.depositConfirmedBy=(store.session&&store.session.name)||"Desk";
      if(b.status==="Request"||b.status==="Times offered"||b.status==="Inbound"||b.status==="Deposit pending Wix") b.status="Deposit paid";
    }
    if(btn.dataset.d==="undep"){
      b.deposit=0;b.depositConfirmed=false;b.depositConfirmedAt=null;b.depositConfirmedBy="";
    }
    if(btn.dataset.d==="take"){if(b.consent&&b.consent.minor&&!b.consent.staffVerify) return alert("Verify minor birth certificate and guardian ID first.");b.status="Walk-in seated";b.deposit=store.cfg.policy.deposit;b.depositConfirmed=true;b.depositConfirmedBy=(store.session&&store.session.name)||"Desk";b.depositConfirmedAt=Date.now()}
    if(btn.dataset.d==="pass")b.status="Passed";
    if(btn.dataset.d==="drop"){
      if(!confirm("Remove "+b.name+" from the floor?"))return;
      store.bookings=store.bookings.filter(x=>x.id!==b.id);save();render();return;
    }
    save();render();
  });
  document.querySelectorAll("[data-ask]").forEach(btn=>btn.onclick=()=>requestConsent(btn.dataset.ask));
  document.querySelectorAll("[data-asksign]").forEach(btn=>btn.onclick=()=>requestArtistSign(btn.dataset.asksign));
  document.querySelectorAll("[data-chat]").forEach(btn=>btn.onclick=()=>{
    const b=store.bookings.find(x=>x.id===btn.dataset.chat);if(!b)return;
    store.chatWith="desk";store.chatName=b.name;render();
  });
  const sw=document.getElementById("sweep");
  if(sw) sw.onclick=()=>{
    const done=["Seated","No-show","Passed","Walk-in seated"];
    const n=store.bookings.filter(b=>done.includes(b.status)).length;
    if(!n) return alert("Nothing finished to clear.");
    if(!confirm("Remove "+n+" seated, passed, or no-show booking"+(n>1?"s":"")+" from the floor?"))return;
    store.bookings=store.bookings.filter(b=>!done.includes(b.status));save();render();
  };
  const o=document.getElementById("out");if(o)o.onclick=logout;
}

function inbox(){

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=900;let w=img.width,h=img.height;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",0.72));
      };
      img.onerror=reject;img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      <p class="note">When the app is live, this URL is what the printed QR opens. Hash #walkin opens create-account.</p>
      <label class="field">Wix pay / deposit URL</label><input id="payUrl" value="${esc(c.payUrl||"https://www.leviathanink.biz/book-online")}"/>
      <label class="field">Live server URL</label><input id="apiUrl" value="${esc(c.apiUrl||"")}" placeholder="https://your-app.onrender.com"/>
      <label class="field">Shop key</label><input id="shopKey" value="${esc(c.shopKey||"leviathan-floor")}"/>
      <p class="note">Paste the Render/Railway URL so every phone shares one book. Leave blank if this page is already that server.</p>
      <button class="primary" id="saveStudio">Save studio</button></div>
      <div class="card"><h2>Policy</h2>
      <label class="field">Deposit $</label><input id="dep" type="number" value="${c.policy.deposit}"/>
      <label class="field">Tattoo minimum $</label><input id="minT" type="number" value="${c.policy.minTattoo}"/>
      <label class="field">Cancel / reschedule hours</label><input id="canH" type="number" value="${c.policy.cancelHours}"/>
      <label class="field">Grace minutes</label><input id="grace" type="number" value="${c.policy.graceMinutes}"/>
      <label class="field">Minimum age</label><input id="age" type="number" value="${c.policy.age}"/>
      <button class="primary" id="savePol">Save policy</button></div>
      <div class="card"><h2>Shop printer</h2>
        <p class="note">Browsers cannot lock onto a USB/network printer by name. Connect the shop printer to this iPad or front-desk computer, set it as the default printer, then name it here. Print / Seated opens the print dialog — pick that printer once and Safari/Chrome will remember it.</p>
        <label class="field">Printer name</label><input id="prnName" value="${esc((c.printer||{}).name||"Front desk")}"/>
        <label class="field">Copies</label><input id="prnCopies" type="number" min="1" value="${(c.printer||{}).copies||1}"/>
        <label class="field">Print notes for staff</label><textarea id="prnNotes">${esc((c.printer||{}).notes||"")}</textarea>
        <label class="check"><input type="checkbox" id="prnAuto" ${(c.printer&&c.printer.autoPrint===false)?"":"checked"}/> Auto-open print dialog after consent</label>
        <button class="primary" id="savePrn">Save printer</button>
        <div style="height:8px"></div>
        <button class="secondary" id="testPrn">Test print</button>
      </div>
      <button class="ghost" id="out">${L("signOut","Sign out")}</button>`;
    document.getElementById("saveStudio").onclick=()=>{
      Object.assign(c.shop,{name:val("shopName"),tag:val("shopTag"),address:val("shopAddr"),phone:val("shopPhone"),hours:val("shopHours"),instagram:val("shopIg"),instagramUrl:val("shopIgUrl"),facebookUrl:val("shopFbUrl"),blurb:val("shopBlurb")});
      c.copy.home=val("homeCopy");c.walkinUrl=val("walkUrl")||"https://leviathanink.biz/join#walkin";c.payUrl=val("payUrl").trim()||"https://www.leviathanink.biz/book-online";c.apiUrl=val("apiUrl").trim();c.shopKey=val("shopKey").trim()||"leviathan-floor";save();alert("Studio saved.");pullLive().then(()=>render());
    };
    document.getElementById("savePol").onclick=()=>{
      Object.assign(c.policy,{deposit:+val("dep")||25,minTattoo:+val("minT")||50,cancelHours:+val("canH")||3,graceMinutes:+val("grace")||15,age:+val("age")||18});save();alert("Policy saved.");render();
    };
    document.getElementById("savePrn").onclick=()=>{
      c.printer=c.printer||{};
      Object.assign(c.printer,{name:val("prnName")||"Front desk",copies:+val("prnCopies")||1,autoPrint:!!document.getElementById("prnAuto").checked,notes:val("prnNotes")});
      save();alert("Printer saved. Set this device’s default printer to that machine.");render();
    };
    document.getElementById("testPrn").onclick=()=>{
      printConsentSheet({id:"TEST",artist:"—",consent:{name:"Printer test",dob:"",age:"",phone:c.shop.phone,email:"",addr:c.shop.address,city:"",proc:"Test",place:"—",idea:"Shop printer test sheet",sign:"Admin",signedAt:Date.now(),docs:{}}});
    };
    document.getElementById("out").onclick=logout;return;
  }
  
  if(store.tab==="look"){
    title.textContent="Look / developer";
    const t=Object.assign({},DEFAULTS.theme,c.theme||{});
    const lab=Object.assign({},DEFAULTS.labels,c.labels||{});
    screen.innerHTML=`<div class="card"><h2>Colors</h2>
      <label class="field">Background / ink</label><input id="cInk" type="color" value="${t.ink}"/>
      <label class="field">Text / bone</label><input id="cBone" type="color" value="${t.bone}"/>
      <label class="field">Primary button</label><input id="cBlood" type="color" value="${t.blood}"/>
      <label class="field">Gold / accents</label><input id="cGold" type="color" value="${t.gold}"/>
      <label class="field">Muted text</label><input id="cMute" type="color" value="${t.mute}"/>
      <label class="field">Lines</label><input id="cLine" type="color" value="${t.line}"/>
      <label class="field">Headline font</label><input id="cFont" value="${esc(t.font)}"/>
      <button class="primary" id="saveTheme">Save colors</button></div>
      <div class="card"><h2>Logo</h2>
      <input id="logoFile" type="file" accept="image/*"/>
      <button class="secondary" id="saveLogo">Replace logo</button>
      <button class="ghost" id="clearLogo">Use original logo</button></div>
      <div class="card"><h2>Background art</h2>
      <input id="bgFile" type="file" accept="image/*"/>
      <button class="secondary" id="saveBg">Set background</button>
      <button class="ghost" id="clearBg">Clear background</button></div>
      <div class="card"><h2>Button text</h2>
      ${Object.keys(lab).map(k=>`<label class="field">${k}</label><input data-lab="${k}" value="${esc(lab[k])}"/>`).join("")}
      <button class="primary" id="saveLabs">Save button text</button></div>
      <button class="ghost" id="out">Sign out</button>`;
    document.getElementById("saveTheme").onclick=()=>{
      c.theme={ink:val("cInk"),bone:val("cBone"),blood:val("cBlood"),gold:val("cGold"),mute:val("cMute"),line:val("cLine"),font:val("cFont")};
      save();applyTheme();alert("Look saved.");render();
    };
    document.getElementById("saveLogo").onclick=async()=>{
      const f=document.getElementById("logoFile").files[0];if(!f)return alert("Choose a logo.");
      c.logo=await compressImage(f);save();applyTheme();render();
    };
    document.getElementById("clearLogo").onclick=()=>{c.logo="";save();location.reload()};
    document.getElementById("saveBg").onclick=async()=>{
      const f=document.getElementById("bgFile").files[0];if(!f)return alert("Choose art.");
      c.bg=await compressImage(f);save();applyTheme();render();
    };
    document.getElementById("clearBg").onclick=()=>{c.bg="";save();applyTheme();render()};
    document.getElementById("saveLabs").onclick=()=>{
      document.querySelectorAll("[data-lab]").forEach(i=>{c.labels[i.dataset.lab]=i.value});
      save();alert("Button text saved.");render();
    };
    document.getElementById("out").onclick=logout;return;
  }

  if(store.tab==="roster"){
    title.textContent="Artists";
    screen.innerHTML=c.artists.map(a=>`<div class="card">
      <label class="field">Name</label><input data-n="${a.id}" value="${esc(a.name)}"/>
      <label class="field">Role / styles</label><input data-r="${a.id}" value="${esc(a.role||"")}"/>
      <label class="field">Username</label><input data-u="${a.id}" value="${esc(a.user||"")}"/>
      <label class="field">PIN</label><input data-p="${a.id}" value="${esc(a.pin||"")}"/>
      <button class="secondary" data-del="${a.id}">Remove</button>
    </div>`).join("")+`<div class="card"><h2>Add artist</h2>
      <label class="field">Name</label><input id="newName"/>
      <label class="field">Role</label><input id="newRole" placeholder="Artist"/>
      <label class="field">Username</label><input id="newUser"/>
      <label class="field">Starter PIN</label><input id="newPin" value="1111"/>
      <button class="primary" id="addArt">Add to roster</button></div>
      <button class="primary" id="saveRoster">Save artists + logins</button>
      <div style="height:8px"></div><button class="ghost" id="out">${L("signOut","Sign out")}</button>`;
    document.getElementById("saveRoster").onclick=()=>{
      c.artists.forEach(a=>{
        const n=document.querySelector(`[data-n="${a.id}"]`);
        const r=document.querySelector(`[data-r="${a.id}"]`);
        const u=document.querySelector(`[data-u="${a.id}"]`);
        const p=document.querySelector(`[data-p="${a.id}"]`);
        if(n){a.name=n.value.trim()||a.name;a.initials=initials(a.name)}
        if(r) a.role=r.value.trim();
        if(u) a.user=u.value.trim().toLowerCase().replace(/\s+/g,"");
        if(p&&p.value.trim()) a.pin=p.value.trim();
      });save();alert("Roster and logins saved.");render();
    };
    document.getElementById("addArt").onclick=()=>{
      const name=val("newName");if(!name)return alert("Name required.");
      const user=(val("newUser")||name).trim().toLowerCase().replace(/\s+/g,"");
      if(c.artists.some(a=>(a.user||"").toLowerCase()===user)) return alert("Username taken.");
      c.artists.push({id:"a"+uid(),name,role:val("newRole")||"Artist",initials:initials(name),user,pin:val("newPin")||"1111",work:[]});save();render();
    };
    screen.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      if(c.artists.length<1)return;
      c.artists=c.artists.filter(a=>a.id!==b.dataset.del);save();render();
    });
    document.getElementById("out").onclick=logout;return;
  }
  if(store.tab==="pay"){title.textContent="Payroll";screen.innerHTML=adminPayView();bindAdminPay();return}
  if(store.tab==="access"){
    title.textContent="Access";
    screen.innerHTML=`<div class="card"><h2>PINs</h2>
      <p class="note">Artists no longer share one PIN. Set each login under Artists. Shop and admin PINs stay here.</p>
      <label class="field">Legacy shared artist PIN (unused)</label><input id="pinA" value="${esc(c.pins.artist)}"/>
      <label class="field">Shop / desk PIN</label><input id="pinD" value="${esc(c.pins.desk)}"/>
      <label class="field">Admin PIN</label><input id="pinAd" value="${esc(c.pins.admin)}"/>
      <button class="primary" id="savePins">Save PINs</button></div>
      <div class="card"><h2>Flash / bookable times</h2>
      <label class="field">One slot per line</label>
      <textarea id="slots">${esc((c.slots||[]).join("\\n"))}</textarea>
      <button class="primary" id="saveSlots">Save times</button></div>
      <div class="card"><button class="secondary" id="resetCfg">Reset shop to Leviathan defaults</button></div>
      <button class="ghost" id="out">${L("signOut","Sign out")}</button>`;
    document.getElementById("savePins").onclick=()=>{c.pins.artist=val("pinA")||"1111";c.pins.desk=val("pinD")||"0000";c.pins.admin=val("pinAd")||"9999";save();alert("PINs saved.");};
    document.getElementById("saveSlots").onclick=()=>{c.slots=val("slots").split(/\\n/).map(x=>x.trim()).filter(Boolean);save();alert("Times saved.");};
    document.getElementById("resetCfg").onclick=()=>{if(!confirm("Reset all shop settings?"))return;store.cfg=JSON.parse(JSON.stringify(DEFAULTS));save();render();};
    document.getElementById("out").onclick=logout;return;
  }
  title.textContent="The book";
  const total=store.bookings.reduce((s,b)=>s+(b.deposit||0),0);
  screen.innerHTML=`<div class="card"><p class="status">Live book</p><h2>${store.bookings.length} appointments · $${total} deposits</h2></div>`+
    (store.bookings.map(b=>`<div class="card"><p class="status">${b.status} · ${b.artist}</p><h2>${b.name}</h2><p>${b.type} · ${b.slot} · ${b.phone}</p>
      <button class="secondary" data-kill="${b.id}">Remove</button></div>`).join("")||`<div class="card"><p>Empty book.</p></div>`)+
    `<button class="secondary" id="wipe">Clear all bookings</button><div style="height:8px"></div><button class="ghost" id="out">${L("signOut","Sign out")}</button>`;
  screen.querySelectorAll("[data-kill]").forEach(b=>b.onclick=()=>{store.bookings=store.bookings.filter(x=>x.id!==b.dataset.kill);save();render()});
  document.getElementById("wipe").onclick=()=>{if(!confirm("Clear the book?"))return;store.bookings=[];store.messages=[];save();render()};
  document.getElementById("out").onclick=logout;
}
function startDeskLive(){
  if(window._levLive) return;
  window._levLive=true;
  window.addEventListener("storage",e=>{
    if(!store.session||store.session.role!=="desk")return;
    if(e.key==="levBookings"||e.key==="levMsgs"){reloadBook();if(store.tab==="board"||store.tab==="channels")render()}
  });
  setInterval(()=>{
    if(!store.session||store.session.role!=="desk")return;
    reloadBook();
    if(store.tab==="board") render();
  },8000);
}
function val(id){return document.getElementById(id).value}
function esc(t){return String(t||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function accounts(){
  try{return JSON.parse(localStorage.getItem("levAccounts")||"[]")}catch(e){return []}
}
function saveAccount(a){
  const list=accounts().filter(x=>x.phone!==a.phone);
  list.unshift(a);
  localStorage.setItem("levAccounts",JSON.stringify(list));
}
function startWalkinJoin(){
  store.session={role:"client",name:store._join.name,phone:store._join.phone,email:store._join.email};
  store.tab="home";
  store.flow={type:"walkin",step:1};
  save();render();
}
if(/walkin|join/i.test(location.hash||"")) store._loginKind="join";
window.addEventListener("hashchange",()=>{if(!store.session && /walkin|join/i.test(location.hash||"")) render("join")});
document.getElementById("tabbar").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b||!store.session)return;store.tab=b.dataset.tab;store.flow=null;store.chatWith=null;render()});
pullLive().finally(()=>{startLiveSync();render(store._loginKind)});



</script>
</body>
</html>
